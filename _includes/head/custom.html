<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>

<style>
  /* kramdown can wrap <summary> text in <p>, which adds big margins */
  details > summary > p {
    display: inline;
    margin: 0;
  }
</style>

<style>
/* Consistent spacing for sidebar profile links */
.sidebar .author__urls > li {
  margin: 0;
  padding: 0;
}

.sidebar .author__urls > li > a {
  display: flex;
  align-items: center;
  gap: 0.5em;
  margin: 0;
  padding: 0.3em 0;
  line-height: 1.5;
}

/* Give every icon the same column width */
.sidebar .author__urls > li > a > i,
.sidebar .author__urls > li > a > img {
  flex: 0 0 1.25em;
  width: 1.25em !important;
  margin: 0 !important;
  padding: 0;
  text-align: center;
}

/* Keep the Bluesky butterfly proportional */
.sidebar .author__urls > li > a > img {
  height: 1em !important;
  object-fit: contain;
}
</style> 

{% if page.collection == "research" %}
<style>
  .page__content img[class*="thumbnail"],
  .page__content img.research-figure {
    display: block;
    max-width: 100%;
    height: auto !important;
    background: transparent;
  }
</style>
{% endif %}
